<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitsune AniVerse</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0712;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  padding:18px 30px;
  background:#130c1d;
  border-bottom:1px solid #3b2850;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:22px;
  font-weight:bold;
  color:#e8b64c;
}
nav a{
  color:#ddd;
  margin-left:18px;
  text-decoration:none;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}
.hero{
  text-align:center;
  padding:70px 20px;
}
.hero h1{
  font-size:55px;
  margin:10px 0;
  color:#c78cff;
}
.hero p{color:#aaa}
button{
  border:0;
  padding:12px 20px;
  border-radius:6px;
  background:#8c42d8;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:.85}
.card{
  background:#171020;
  border:1px solid #382544;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  background:#0e0915;
  color:#fff;
  border:1px solid #443052;
  border-radius:5px;
}
label{
  color:#c9b7d8;
  font-size:13px;
}
.hidden{display:none!important}
.social a{
  display:inline-block;
  margin:6px;
  padding:10px 15px;
  border:1px solid #49335a;
  border-radius:6px;
  color:#fff;
  text-decoration:none;
}
.post{
  border:1px solid #35233f;
  background:#140d1c;
  padding:18px;
  border-radius:8px;
  margin-bottom:18px;
}
.post img,.post video{
  max-width:100%;
  border-radius:6px;
  margin-top:10px;
}
.small{color:#888;font-size:12px}
.danger{background:#a52245}
.success{color:#70e09b}
</style>
</head>

<body>

<header>
  <div class="logo">🦊 Kitsune AniVerse</div>

  <nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showCreator()">Creator Panel</a>
  </nav>
</header>

<main class="container">

<section id="home">
  <div class="hero">
    <h1>KITSUNE ANIVERSE</h1>
    <p>Original manga, art, stories & videos.</p>

    <div id="socialLinks" class="social"></div>

    <button id="homeLoginBtn" onclick="googleLogin()">
      Connect Google Account
    </button>

    <p id="homeUserInfo" class="small"></p>
  </div>

  <div id="posts"></div>
</section>


<section id="creator" class="hidden">

  <div class="card">

    <h2>Creator Panel</h2>

    <p id="userInfo" class="small">Not connected.</p>

    <button id="creatorLoginBtn" onclick="googleLogin()">
      Connect / Login with Google
    </button>

    <button onclick="logout()">
      Logout
    </button>

  </div>


  <div id="adminPanel" class="hidden">

    <div class="card">

      <h2>Website Settings</h2>

      <label>Website Name</label>
      <input id="siteName" placeholder="Kitsune AniVerse">

      <label>Facebook URL</label>
      <input id="facebook" placeholder="https://facebook.com/...">

      <label>Instagram URL</label>
      <input id="instagram" placeholder="https://instagram.com/...">

      <label>YouTube URL</label>
      <input id="youtube" placeholder="https://youtube.com/...">

      <label>Website Logo</label>
      <input type="file" id="logoFile" accept="image/*">

      <button onclick="saveSettings()">
        Save Website Settings
      </button>

      <p id="settingsStatus"></p>

    </div>


    <div class="card">

      <h2>Create New Post</h2>

      <label>Post Title</label>
      <input id="postTitle" placeholder="Post title">

      <label>Description</label>
      <textarea
        id="postDescription"
        placeholder="Write something..."
      ></textarea>

      <label>Upload Image / Video</label>
      <input
        type="file"
        id="postFile"
        accept="image/*,video/*"
      >

      <button onclick="uploadPost()">
        Publish Post
      </button>

      <p id="uploadStatus"></p>

    </div>


    <div class="card">

      <h2>Manage Posts</h2>
      <div id="adminPosts"></div>

    </div>

  </div>

</section>

</main>


<!-- Firebase -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  setDoc,
  getDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCSOp-P6Wec72xmjE581dOVmheJ-ytQf2w",
  authDomain: "kitsune-aniverse.firebaseapp.com",
  projectId: "kitsune-aniverse",
  storageBucket: "kitsune-aniverse.firebasestorage.app",
  messagingSenderId: "73724605125",
  appId: "1:73724605125:web:8f6a0577ada949a26f36ac",
  measurementId: "G-5RMPCXW8GF"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);

const provider = new GoogleAuthProvider();


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL = "lightyagami096kira@gmail.com";


/* =========================
   GLOBAL USER
========================= */

let currentUser = null;


/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin = async function(){

  try{

    const result =
      await signInWithPopup(auth, provider);

    currentUser = result.user;

    alert(
      "Google account connected successfully!"
    );

    updateUserUI();

  }catch(error){

    console.error(error);

    alert(
      "Google login failed: " +
      error.message
    );

  }

};


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  await signOut(auth);

  currentUser = null;

  updateUserUI();

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  (user)=>{

    currentUser = user;

    updateUserUI();

  }
);


/* =========================
   USER UI
========================= */

function updateUserUI(){

  const info =
    document.getElementById("userInfo");

  const admin =
    document.getElementById("adminPanel");

  const homeLoginBtn =
    document.getElementById("homeLoginBtn");

  const creatorLoginBtn =
    document.getElementById("creatorLoginBtn");

  const homeUserInfo =
    document.getElementById("homeUserInfo");


  if(!currentUser){

    if(info){
      info.innerHTML =
        "Not connected.";
    }

    if(admin){
      admin.classList.add("hidden");
    }

    if(homeLoginBtn){
      homeLoginBtn.style.display =
        "inline-block";
    }

    if(creatorLoginBtn){
      creatorLoginBtn.style.display =
        "inline-block";
    }

    if(homeUserInfo){
      homeUserInfo.innerHTML = "";
    }

    return;

  }


  const email =
    currentUser.email || "";


  if(info){

    info.innerHTML =
      "Connected as: <b>" +
      email +
      "</b>";

  }


  if(homeLoginBtn){
    homeLoginBtn.style.display =
      "none";
  }


  if(creatorLoginBtn){
    creatorLoginBtn.style.display =
      "none";
  }


  if(homeUserInfo){

    homeUserInfo.innerHTML =
      "Connected as: <b>" +
      email +
      "</b>";

  }


  if(
    email.toLowerCase()
    === ADMIN_EMAIL.toLowerCase()
  ){

    admin.classList.remove(
      "hidden"
    );

    loadSettings();

    loadAdminPosts();

  }else{

    admin.classList.add(
      "hidden"
    );

  }

}


/* =========================
   NAVIGATION
========================= */

window.showHome = function(){

  document
    .getElementById("home")
    .classList.remove("hidden");

  document
    .getElementById("creator")
    .classList.add("hidden");

  loadPosts();

};


window.showCreator = function(){

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("creator")
    .classList.remove("hidden");

  updateUserUI();

};


/* =========================
   LOAD WEBSITE SETTINGS
========================= */

async function loadSettings(){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "settings",
          "website"
        )
      );


    if(!snap.exists())
      return;


    const data =
      snap.data();


    document.getElementById(
      "siteName"
    ).value =
      data.siteName ||
      "Kitsune AniVerse";


    document.getElementById(
      "facebook"
    ).value =
      data.facebook || "";


    document.getElementById(
      "instagram"
    ).value =
      data.instagram || "";


    document.getElementById(
      "youtube"
    ).value =
      data.youtube || "";


    updateSocialLinks(data);

  }catch(error){

    console.error(error);

  }

}


/* =========================
   SAVE SETTINGS
========================= */

window.saveSettings =
async function(){

  if(!isAdmin()){

    alert("Admin only.");

    return;

  }


  const siteName =
    document
      .getElementById(
        "siteName"
      )
      .value;


  const facebook =
    document
      .getElementById(
        "facebook"
      )
      .value;


  const instagram =
    document
      .getElementById(
        "instagram"
      )
      .value;


  const youtube =
    document
      .getElementById(
        "youtube"
      )
      .value;


  await setDoc(

    doc(
      db,
      "settings",
      "website"
    ),

    {
      siteName,
      facebook,
      instagram,
      youtube,
      updatedAt:
        Date.now()
    },

    {
      merge:true
    }

  );


  document.getElementById(
    "settingsStatus"
  ).innerHTML =
    '<span class="success">' +
    'Settings saved successfully.' +
    '</span>';


  updateSocialLinks({

    facebook,
    instagram,
    youtube

  });

};


/* =========================
   SOCIAL LINKS
========================= */

function updateSocialLinks(data){

  const box =
    document.getElementById(
      "socialLinks"
    );

  let html = "";


  if(data.facebook){

    html +=
      `<a
        href="${escapeAttr(data.facebook)}"
        target="_blank">
        Facebook
      </a>`;

  }


  if(data.instagram){

    html +=
      `<a
        href="${escapeAttr(data.instagram)}"
        target="_blank">
        Instagram
      </a>`;

  }


  if(data.youtube){

    html +=
      `<a
        href="${escapeAttr(data.youtube)}"
        target="_blank">
        YouTube
      </a>`;

  }


  box.innerHTML = html;

}


/* =========================
   ADMIN CHECK
========================= */

function isAdmin(){

  return currentUser &&
    currentUser.email &&
    currentUser.email.toLowerCase()
    === ADMIN_EMAIL.toLowerCase();

}


/* =========================
   UPLOAD POST
========================= */

window.uploadPost =
async function(){

  if(!isAdmin()){

    alert(
      "Only the admin can publish posts."
    );

    return;

  }


  const title =
    document
      .getElementById(
        "postTitle"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "postDescription"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "postFile"
      )
      .files[0];


  if(!title){

    alert(
      "Enter a post title."
    );

    return;

  }


  if(!file){

    alert(
      "Choose an image or video."
    );

    return;

  }


  const status =
    document.getElementById(
      "uploadStatus"
    );


  status.innerText =
    "Uploading... 0%";


  try{

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const storageRef =
      ref(
        storage,
        "posts/" +
        Date.now() +
        "_" +
        safeName
      );


    const uploadTask =
      uploadBytesResumable(
        storageRef,
        file
      );


    uploadTask.on(

      "state_changed",

      (snapshot)=>{

        const progress =
          Math.round(

            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100

          );


        status.innerText =
          "Uploading... " +
          progress +
          "%";

      },


      (error)=>{

        console.error(error);

        status.innerText =
          "Upload failed: " +
          error.message;

      },


      async ()=>{

        const url =
          await getDownloadURL(
            uploadTask.snapshot.ref
          );


        const type =
          file.type.startsWith("video")
          ? "video"
          : "image";


        await addDoc(

          collection(
            db,
            "posts"
          ),

          {

            title,

            description,

            url,

            type,

            fileName:
              file.name,

            createdAt:
              Date.now(),

            createdBy:
              currentUser.email

          }

        );


        status.innerHTML =
          '<span class="success">' +
          'Post published successfully!' +
          '</span>';


        document.getElementById(
          "postTitle"
        ).value = "";


        document.getElementById(
          "postDescription"
        ).value = "";


        document.getElementById(
          "postFile"
        ).value = "";


        loadPosts();

        loadAdminPosts();

      }

    );

  }catch(error){

    console.error(error);

    status.innerText =
      "Upload failed: " +
      error.message;

  }

};


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const box =
    document.getElementById(
      "posts"
    );


  try{

    const q =
      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      box.innerHTML =
        '<div class="card">' +
        '<h2>No posts yet</h2>' +
        '<p class="small">' +
        'New manga, art and videos will appear here.' +
        '</p>' +
        '</div>';

      return;

    }


    let html = "";


    snapshot.forEach(
      (item)=>{

        const p =
          item.data();


        html += `

          <article class="post">

            <h2>
              ${escapeHtml(
                p.title
              )}
            </h2>

            <p>
              ${escapeHtml(
                p.description || ""
              )}
            </p>

            ${
              p.type === "video"

              ?

              `<video
                controls
                preload="metadata"
                src="${escapeAttr(
                  p.url
                )}">
              </video>`

              :

              `<img
                loading="lazy"
                src="${escapeAttr(
                  p.url
                )}"
                alt="${escapeAttr(
                  p.title
                )}">`
            }

            <div class="small">

              Published by
              ${escapeHtml(
                p.createdBy ||
                "Kitsune AniVerse"
              )}

            </div>

          </article>

        `;

      }
    );


    box.innerHTML =
      html;


  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="card">
        <p>Could not load posts.</p>
      </div>`;

  }

}


/* =========================
   ADMIN POST LIST
========================= */

async function loadAdminPosts(){

  if(!isAdmin())
    return;


  const box =
    document.getElementById(
      "adminPosts"
    );


  const snapshot =
    await getDocs(

      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      )

    );


  if(snapshot.empty){

    box.innerHTML =
      "<p class='small'>No posts.</p>";

    return;

  }


  let html = "";


  snapshot.forEach(
    (item)=>{

      const p =
        item.data();


      html += `

        <div class="post">

          <b>
            ${escapeHtml(
              p.title
            )}
          </b>

          <div class="small">
            ${escapeHtml(
              p.fileName || ""
            )}
          </div>

          <br>

          <button
            class="danger"
            onclick="deletePost(
              '${item.id}',
              '${escapeAttr(
                p.url
              )}'
            )">

            Delete

          </button>

        </div>

      `;

    }
  );


  box.innerHTML =
    html;

}


/* =========================
   DELETE POST
========================= */

window.deletePost =
async function(
  id,
  url
){

  if(!isAdmin()){

    alert(
      "Admin only."
    );

    return;

  }


  if(
    !confirm(
      "Delete this post permanently?"
    )
  )
    return;


  try{

    await deleteDoc(
      doc(
        db,
        "posts",
        id
      )
    );


    try{

      const fileRef =
        ref(
          storage,
          url
        );


      await deleteObject(
        fileRef
      );

    }catch(e){

      console.log(
        "Storage file could not be deleted:",
        e
      );

    }


    loadPosts();

    loadAdminPosts();


  }catch(error){

    alert(
      "Delete failed: " +
      error.message
    );

  }

};


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(
    value || ""
  )

  .replace(
    /[&<>"']/g,

    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }

  );

}


function escapeAttr(value){

  return String(
    value || ""
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================
   START
========================= */

loadPosts();

</script>

</body>
</html>
