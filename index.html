<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitsune AniVerse</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0712;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 30px;
  background:#130c1d;
  border-bottom:1px solid #3b2850;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logoArea{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoImage{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:6px;
  display:none;
}

.logoText{
  font-size:22px;
  font-weight:bold;
  color:#e8b64c;
}

nav a{
  color:#ddd;
  margin-left:18px;
  text-decoration:none;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

.hero{
  text-align:center;
  padding:70px 20px;
}

.hero h1{
  font-size:55px;
  margin:10px 0;
  color:#c78cff;
}

.hero p{
  color:#aaa;
}

button{
  border:0;
  padding:12px 20px;
  border-radius:6px;
  background:#8c42d8;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

button:hover{
  opacity:.85;
}

.card{
  background:#171020;
  border:1px solid #382544;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 15px;
  background:#0e0915;
  color:#fff;
  border:1px solid #443052;
  border-radius:5px;
}

label{
  color:#c9b7d8;
  font-size:13px;
}

.hidden{
  display:none!important;
}

.social a{
  display:inline-block;
  margin:6px;
  padding:10px 15px;
  border:1px solid #49335a;
  border-radius:6px;
  color:#fff;
  text-decoration:none;
}

.post{
  border:1px solid #35233f;
  background:#140d1c;
  padding:18px;
  border-radius:8px;
  margin-bottom:18px;
}

.post img,
.post video{
  max-width:100%;
  border-radius:6px;
  margin-top:10px;
}

.post iframe{
  width:100%;
  height:700px;
  border:0;
  border-radius:6px;
  margin-top:10px;
  background:#fff;
}

.small{
  color:#888;
  font-size:12px;
}

.danger{
  background:#a52245;
}

.success{
  color:#70e09b;
}

.warning{
  color:#e8b64c;
}

.progressBox{
  width:100%;
  height:10px;
  background:#0e0915;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.progressBar{
  width:0%;
  height:100%;
  background:#8c42d8;
  transition:width .2s;
}

.previewLogo{
  max-width:120px;
  max-height:80px;
  display:none;
  margin:10px 0;
  border-radius:6px;
}

.editBox{
  border-top:1px solid #35233f;
  margin-top:15px;
  padding-top:15px;
}
</style>
</head>

<body>

<header>

  <div class="logoArea">

    <img
      id="logoImage"
      class="logoImage"
      alt="Website Logo">

    <div
      id="logoText"
      class="logoText">
      🦊 Kitsune AniVerse
    </div>

  </div>

  <nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showCreator()">Creator Panel</a>
  </nav>

</header>


<main class="container">

<section id="home">

  <div class="hero">

    <h1>KITSUNE ANIVERSE</h1>

    <p>
      Original manga, art, stories & videos.
    </p>

    <div
      id="socialLinks"
      class="social">
    </div>

    <button
      id="homeLoginBtn"
      onclick="googleLogin()">
      Connect Google Account
    </button>

    <p
      id="homeUserInfo"
      class="small">
    </p>

  </div>

  <div id="posts"></div>

</section>


<section id="creator" class="hidden">

  <div class="card">

    <h2>Creator Panel</h2>

    <p
      id="userInfo"
      class="small">
      Not connected.
    </p>

    <button
      id="creatorLoginBtn"
      onclick="googleLogin()">
      Connect / Login with Google
    </button>

    <button onclick="logout()">
      Logout
    </button>

  </div>


  <div
    id="adminPanel"
    class="hidden">


    <!-- WEBSITE SETTINGS -->

    <div class="card">

      <h2>Website Settings</h2>


      <label>
        Website Name
      </label>

      <input
        id="siteName"
        placeholder="Kitsune AniVerse">


      <label>
        Facebook URL
      </label>

      <input
        id="facebook"
        placeholder="https://facebook.com/...">


      <label>
        Instagram URL
      </label>

      <input
        id="instagram"
        placeholder="https://instagram.com/...">


      <label>
        YouTube URL
      </label>

      <input
        id="youtube"
        placeholder="https://youtube.com/...">


      <label>
        Website Logo
      </label>

      <input
        type="file"
        id="logoFile"
        accept="image/*">


      <img
        id="logoPreview"
        class="previewLogo"
        alt="Logo Preview">


      <button
        onclick="saveSettings()">
        Save Website Settings
      </button>

      <p id="settingsStatus"></p>

    </div>


    <!-- CREATE POST -->

    <div class="card">

      <h2>
        Create New Post / Manga
      </h2>


      <label>
        Post / Manga Title
      </label>

      <input
        id="postTitle"
        placeholder="Chapter 1 - The Beginning">


      <label>
        Description
      </label>

      <textarea
        id="postDescription"
        placeholder="Write something...">
      </textarea>


      <label>
        Upload Image / Video / PDF
      </label>

      <input
        type="file"
        id="postFile"
        accept="image/*,video/*,application/pdf,.pdf">


      <div
        id="uploadProgressArea"
        class="hidden">

        <div
          class="progressBox">

          <div
            id="uploadProgressBar"
            class="progressBar">
          </div>

        </div>

        <p
          id="uploadProgressText"
          class="small">
          Uploading... 0%
        </p>

      </div>


      <button
        onclick="uploadPost()">
        Publish Post
      </button>

      <p id="uploadStatus"></p>

    </div>


    <!-- MANAGE POSTS -->

    <div class="card">

      <h2>
        Manage Posts / Manga
      </h2>

      <div id="adminPosts"></div>

    </div>

  </div>

</section>

</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  setDoc,
  getDoc,
  query,
  orderBy,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCSOp-P6Wec72xmjE581dOVmheJ-ytQf2w",

  authDomain:
    "kitsune-aniverse.firebaseapp.com",

  projectId:
    "kitsune-aniverse",

  storageBucket:
    "kitsune-aniverse.firebasestorage.app",

  messagingSenderId:
    "73724605125",

  appId:
    "1:73724605125:web:8f6a0577ada949a26f36ac",

  measurementId:
    "G-5RMPCXW8GF"

};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const storage =
  getStorage(app);

const provider =
  new GoogleAuthProvider();


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
  "lightyagami096kira@gmail.com";


/* =========================
   GLOBAL USER
========================= */

let currentUser = null;


/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin =
async function(){

  try{

    const result =
      await signInWithPopup(
        auth,
        provider
      );

    currentUser =
      result.user;

    alert(
      "Google account connected successfully!"
    );

    updateUserUI();

  }catch(error){

    console.error(error);

    alert(
      "Google login failed: " +
      error.message
    );

  }

};


/* =========================
   LOGOUT
========================= */

window.logout =
async function(){

  await signOut(auth);

  currentUser = null;

  updateUserUI();

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  (user)=>{

    currentUser = user;

    updateUserUI();

  }
);


/* =========================
   USER UI
========================= */

function updateUserUI(){

  const info =
    document.getElementById(
      "userInfo"
    );

  const admin =
    document.getElementById(
      "adminPanel"
    );

  const homeLoginBtn =
    document.getElementById(
      "homeLoginBtn"
    );

  const creatorLoginBtn =
    document.getElementById(
      "creatorLoginBtn"
    );

  const homeUserInfo =
    document.getElementById(
      "homeUserInfo"
    );


  if(!currentUser){

    if(info)
      info.innerHTML =
        "Not connected.";


    if(admin)
      admin.classList.add(
        "hidden"
      );


    if(homeLoginBtn)
      homeLoginBtn.style.display =
        "inline-block";


    if(creatorLoginBtn)
      creatorLoginBtn.style.display =
        "inline-block";


    if(homeUserInfo)
      homeUserInfo.innerHTML =
        "";


    return;

  }


  const email =
    currentUser.email || "";


  if(info){

    info.innerHTML =
      "Connected as: <b>" +
      escapeHtml(email) +
      "</b>";

  }


  if(homeLoginBtn)
    homeLoginBtn.style.display =
      "none";


  if(creatorLoginBtn)
    creatorLoginBtn.style.display =
      "none";


  if(homeUserInfo){

    homeUserInfo.innerHTML =
      "Connected as: <b>" +
      escapeHtml(email) +
      "</b>";

  }


  if(
    email.toLowerCase()
    === ADMIN_EMAIL.toLowerCase()
  ){

    admin.classList.remove(
      "hidden"
    );

    loadSettings();

    loadAdminPosts();

  }else{

    admin.classList.add(
      "hidden"
    );

  }

}


/* =========================
   NAVIGATION
========================= */

window.showHome =
function(){

  document
    .getElementById("home")
    .classList.remove(
      "hidden"
    );

  document
    .getElementById("creator")
    .classList.add(
      "hidden"
    );

  loadPosts();

};


window.showCreator =
function(){

  document
    .getElementById("home")
    .classList.add(
      "hidden"
    );

  document
    .getElementById("creator")
    .classList.remove(
      "hidden"
    );

  updateUserUI();

};


/* =========================
   LOAD SETTINGS
========================= */

async function loadSettings(){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "settings",
          "website"
        )
      );


    if(!snap.exists())
      return;


    const data =
      snap.data();


    document.getElementById(
      "siteName"
    ).value =
      data.siteName ||
      "Kitsune AniVerse";


    document.getElementById(
      "facebook"
    ).value =
      data.facebook || "";


    document.getElementById(
      "instagram"
    ).value =
      data.instagram || "";


    document.getElementById(
      "youtube"
    ).value =
      data.youtube || "";


    updateSocialLinks(data);

    updateLogo(data.logoUrl || "");

  }catch(error){

    console.error(error);

  }

}


/* =========================
   LOGO PREVIEW
========================= */

document
  .getElementById("logoFile")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      const preview =
        document.getElementById(
          "logoPreview"
        );


      if(!file){

        preview.style.display =
          "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          preview.src =
            e.target.result;

          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   SAVE SETTINGS + LOGO
========================= */

window.saveSettings =
async function(){

  if(!isAdmin()){

    alert("Admin only.");

    return;

  }


  const status =
    document.getElementById(
      "settingsStatus"
    );


  status.innerText =
    "Saving settings...";


  try{

    const siteName =
      document
        .getElementById(
          "siteName"
        )
        .value;


    const facebook =
      document
        .getElementById(
          "facebook"
        )
        .value;


    const instagram =
      document
        .getElementById(
          "instagram"
        )
        .value;


    const youtube =
      document
        .getElementById(
          "youtube"
        )
        .value;


    const logoFile =
      document
        .getElementById(
          "logoFile"
        )
        .files[0];


    let logoUrl =
      "";


    let logoStoragePath =
      "";


    if(logoFile){

      status.innerText =
        "Uploading logo...";


      const safeName =
        logoFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      logoStoragePath =
        "website/logo_" +
        Date.now() +
        "_" +
        safeName;


      const logoRef =
        ref(
          storage,
          logoStoragePath
        );


      const uploadTask =
        uploadBytesResumable(
          logoRef,
          logoFile
        );


      await new Promise(
        (resolve,reject)=>{

          uploadTask.on(

            "state_changed",

            (snapshot)=>{

              const progress =
                Math.round(
                  (
                    snapshot.bytesTransferred /
                    snapshot.totalBytes
                  ) * 100
                );

              status.innerText =
                "Uploading logo... " +
                progress +
                "%";

            },

            reject,

            async ()=>{

              logoUrl =
                await getDownloadURL(
                  uploadTask.snapshot.ref
                );

              resolve();

            }

          );

        }
      );

    }


    const existingSnap =
      await getDoc(
        doc(
          db,
          "settings",
          "website"
        )
      );


    const existingData =
      existingSnap.exists()
      ? existingSnap.data()
      : {};


    await setDoc(

      doc(
        db,
        "settings",
        "website"
      ),

      {

        siteName,

        facebook,

        instagram,

        youtube,

        logoUrl:
          logoUrl ||
          existingData.logoUrl ||
          "",

        logoStoragePath:
          logoStoragePath ||
          existingData.logoStoragePath ||
          "",

        updatedAt:
          Date.now()

      },

      {
        merge:true
      }

    );


    status.innerHTML =
      '<span class="success">' +
      'Settings saved successfully.' +
      '</span>';


    updateSocialLinks({

      facebook,
      instagram,
      youtube

    });


    updateLogo(
      logoUrl ||
      existingData.logoUrl ||
      ""
    );


    document.getElementById(
      "logoFile"
    ).value = "";


    document.getElementById(
      "logoPreview"
    ).style.display =
      "none";


  }catch(error){

    console.error(error);

    status.innerHTML =
      '<span class="danger">' +
      'Save failed: ' +
      escapeHtml(
        error.message
      ) +
      '</span>';

  }

};


/* =========================
   UPDATE LOGO
========================= */

function updateLogo(url){

  const image =
    document.getElementById(
      "logoImage"
    );

  const text =
    document.getElementById(
      "logoText"
    );


  if(url){

    image.src = url;

    image.style.display =
      "block";

    text.textContent =
      "Kitsune AniVerse";

  }else{

    image.style.display =
      "none";

    text.textContent =
      "🦊 Kitsune AniVerse";

  }

}


/* =========================
   SOCIAL LINKS
========================= */

function updateSocialLinks(data){

  const box =
    document.getElementById(
      "socialLinks"
    );

  let html = "";


  if(data.facebook){

    html +=
      `<a
        href="${escapeAttr(
          data.facebook
        )}"
        target="_blank"
        rel="noopener">
        Facebook
      </a>`;

  }


  if(data.instagram){

    html +=
      `<a
        href="${escapeAttr(
          data.instagram
        )}"
        target="_blank"
        rel="noopener">
        Instagram
      </a>`;

  }


  if(data.youtube){

    html +=
      `<a
        href="${escapeAttr(
          data.youtube
        )}"
        target="_blank"
        rel="noopener">
        YouTube
      </a>`;

  }


  box.innerHTML =
    html;

}


/* =========================
   ADMIN CHECK
========================= */

function isAdmin(){

  return currentUser &&
    currentUser.email &&
    currentUser.email
      .toLowerCase()
      ===
      ADMIN_EMAIL.toLowerCase();

}


/* =========================
   UPLOAD POST / MANGA
========================= */

window.uploadPost =
async function(){

  if(!isAdmin()){

    alert(
      "Only the admin can publish posts."
    );

    return;

  }


  const title =
    document
      .getElementById(
        "postTitle"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "postDescription"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "postFile"
      )
      .files[0];


  if(!title){

    alert(
      "Enter a post or manga title."
    );

    return;

  }


  if(!file){

    alert(
      "Choose an image, video or PDF."
    );

    return;

  }


  const status =
    document.getElementById(
      "uploadStatus"
    );


  const progressArea =
    document.getElementById(
      "uploadProgressArea"
    );


  const progressBar =
    document.getElementById(
      "uploadProgressBar"
    );


  const progressText =
    document.getElementById(
      "uploadProgressText"
    );


  status.innerText =
    "Preparing upload...";


  progressArea.classList.remove(
    "hidden"
  );


  progressBar.style.width =
    "0%";


  try{

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    const storagePath =
      "posts/" +
      Date.now() +
      "_" +
      safeName;


    const storageRef =
      ref(
        storage,
        storagePath
      );


    const uploadTask =
      uploadBytesResumable(
        storageRef,
        file
      );


    uploadTask.on(

      "state_changed",

      (snapshot)=>{

        const progress =
          Math.round(

            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100

          );


        progressBar.style.width =
          progress + "%";


        progressText.innerText =
          "Uploading... " +
          progress +
          "%";


        status.innerText =
          "Uploading " +
          file.name;

      },


      (error)=>{

        console.error(error);

        status.innerText =
          "Upload failed: " +
          error.message;

        progressArea.classList.add(
          "hidden"
        );

      },


      async ()=>{

        const url =
          await getDownloadURL(
            uploadTask.snapshot.ref
          );


        let type =
          "image";


        if(
          file.type ===
          "application/pdf"
          ||
          file.name
            .toLowerCase()
            .endsWith(".pdf")
        ){

          type =
            "pdf";

        }else if(
          file.type.startsWith(
            "video/"
          )
        ){

          type =
            "video";

        }


        await addDoc(

          collection(
            db,
            "posts"
          ),

          {

            title,

            description,

            url,

            type,

            fileName:
              file.name,

            storagePath,

            fileSize:
              file.size,

            createdAt:
              Date.now(),

            createdBy:
              currentUser.email

          }

        );


        status.innerHTML =
          '<span class="success">' +
          'Published successfully!' +
          '</span>';


        document.getElementById(
          "postTitle"
        ).value = "";


        document.getElementById(
          "postDescription"
        ).value = "";


        document.getElementById(
          "postFile"
        ).value = "";


        progressText.innerText =
          "Upload complete: 100%";


        progressBar.style.width =
          "100%";


        loadPosts();

        loadAdminPosts();


        setTimeout(
          ()=>{

            progressArea.classList.add(
              "hidden"
            );

          },
          1500
        );

      }

    );

  }catch(error){

    console.error(error);

    status.innerText =
      "Upload failed: " +
      error.message;

    progressArea.classList.add(
      "hidden"
    );

  }

};


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const box =
    document.getElementById(
      "posts"
    );


  try{

    const q =
      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      box.innerHTML =
        '<div class="card">' +
        '<h2>No posts yet</h2>' +
        '<p class="small">' +
        'New manga, art and videos will appear here.' +
        '</p>' +
        '</div>';

      return;

    }


    let html = "";


    snapshot.forEach(
      (item)=>{

        const p =
          item.data();


        let media = "";


        if(p.type === "pdf"){

          media = `

            <div class="card">

              <p>
                📕 Manga PDF
              </p>

              <button
                onclick="window.open(
                  '${escapeAttr(p.url)}',
                  '_blank'
                )">

                Read Manga PDF

              </button>

            </div>

          `;

        }else if(
          p.type === "video"
        ){

          media = `

            <video
              controls
              preload="metadata"
              src="${escapeAttr(
                p.url
              )}">
            </video>

          `;

        }else{

          media = `

            <img
              loading="lazy"
              src="${escapeAttr(
                p.url
              )}"
              alt="${escapeAttr(
                p.title
              )}">

          `;

        }


        html += `

          <article
            class="post">

            <h2>
              ${escapeHtml(
                p.title
              )}
            </h2>

            <p>
              ${escapeHtml(
                p.description || ""
              )}
            </p>

            ${media}

            <div class="small">

              Published by
              ${escapeHtml(
                p.createdBy ||
                "Kitsune AniVerse"
              )}

            </div>

          </article>

        `;

      }
    );


    box.innerHTML =
      html;


  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="card">
        <p>
          Could not load posts.
        </p>
      </div>`;

  }

}


/* =========================
   ADMIN POST LIST
========================= */

async function loadAdminPosts(){

  if(!isAdmin())
    return;


  const box =
    document.getElementById(
      "adminPosts"
    );


  try{

    const snapshot =
      await getDocs(

        query(

          collection(
            db,
            "posts"
          ),

          orderBy(
            "createdAt",
            "desc"
          )

        )

      );


    if(snapshot.empty){

      box.innerHTML =
        "<p class='small'>" +
        "No posts." +
        "</p>";

      return;

    }


    let html = "";


    snapshot.forEach(
      (item)=>{

        const p =
          item.data();


        html += `

          <div
            class="post">

            <b>
              ${escapeHtml(
                p.title
              )}
            </b>

            <div class="small">

              ${escapeHtml(
                p.fileName || ""
              )}

            </div>


            <div class="small">

              Type:
              ${escapeHtml(
                p.type || "image"
              )}

            </div>


            <br>


            <button
              onclick="editPost(
                '${item.id}'
              )">

              Edit

            </button>


            <button
              class="danger"
              onclick="deletePost(
                '${item.id}'
              )">

              Delete

            </button>


            <div
              id="edit-${item.id}"
              class="editBox hidden">

              <input
                id="edit-title-${item.id}"
                value="${escapeAttr(
                  p.title || ""
                )}"
                placeholder="Title">


              <textarea
                id="edit-description-${item.id}"
                placeholder="Description">${escapeHtml(
                  p.description || ""
                )}</textarea>


              <button
                onclick="savePostEdit(
                  '${item.id}'
                )">

                Save Edit

              </button>

            </div>

          </div>

        `;

      }
    );


    box.innerHTML =
      html;

  }catch(error){

    console.error(error);

    box.innerHTML =
      "<p>Could not load admin posts.</p>";

  }

}


/* =========================
   EDIT POST
========================= */

window.editPost =
function(id){

  const box =
    document.getElementById(
      "edit-" + id
    );


  if(box)
    box.classList.toggle(
      "hidden"
    );

};


/* =========================
   SAVE POST EDIT
========================= */

window.savePostEdit =
async function(id){

  if(!isAdmin()){

    alert(
      "Admin only."
    );

    return;

  }


  const title =
    document.getElementById(
      "edit-title-" + id
    ).value.trim();


  const description =
    document.getElementById(
      "edit-description-" + id
    ).value.trim();


  if(!title){

    alert(
      "Title cannot be empty."
    );

    return;

  }


  try{

    await updateDoc(

      doc(
        db,
        "posts",
        id
      ),

      {

        title,

        description,

        updatedAt:
          Date.now()

      }

    );


    alert(
      "Post updated successfully!"
    );


    loadPosts();

    loadAdminPosts();

  }catch(error){

    alert(
      "Edit failed: " +
      error.message
    );

  }

};


/* =========================
   DELETE POST
========================= */

window.deletePost =
async function(id){

  if(!isAdmin()){

    alert(
      "Admin only."
    );

    return;

  }


  if(
    !confirm(
      "Delete this post permanently?"
    )
  )
    return;


  try{

    const postRef =
      doc(
        db,
        "posts",
        id
      );


    const snap =
      await getDoc(
        postRef
      );


    if(
      !snap.exists()
    ){

      alert(
        "Post not found."
      );

      return;

    }


    const data =
      snap.data();


    await deleteDoc(
      postRef
    );


    if(
      data.storagePath
    ){

      try{

        await deleteObject(
          ref(
            storage,
            data.storagePath
          )
        );

      }catch(storageError){

        console.log(
          "Storage file could not be deleted:",
          storageError
        );

      }

    }


    loadPosts();

    loadAdminPosts();


    alert(
      "Post deleted successfully!"
    );


  }catch(error){

    alert(
      "Delete failed: " +
      error.message
    );

  }

};


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(
    value || ""
  )

  .replace(
    /[&<>"']/g,

    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    }

  );

}


function escapeAttr(value){

  return String(
    value || ""
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================
   START
========================= */

loadPosts();

</script>
