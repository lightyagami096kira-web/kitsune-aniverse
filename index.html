<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitsune AniVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0710;--panel:#140e1f;--crimson:#d21f3c;--violet:#8b2fd6;--text:#f3ecfa;--text-dim:#a294bd}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh}
nav{padding:20px 5vw;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:30;background:rgba(10,7,16,.94)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-logo{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--crimson),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;overflow:hidden;flex:none}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{font-family:'Shippori Mincho B1',serif;font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-right{display:flex;align-items:center;gap:20px;float:right;margin-top:-40px}
.tabs{display:flex;gap:15px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:6px;background:var(--panel);cursor:pointer;font-weight:700;transition:.2s;border:none;font-size:13px;color:var(--text)}
.tab.active{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff}
.user-menu{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-radius:6px;cursor:pointer;font-size:12px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#b565ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
.content{padding:40px 5vw;max-width:1400px;margin:0 auto}
.hero{margin:60px 0 80px}.hero h1{font-size:48px;font-family:'Shippori Mincho B1',serif;margin-bottom:20px;line-height:1.2}.hero p{font-size:16px;color:var(--text-dim);max-width:600px;line-height:1.7}
.btns{display:flex;gap:15px;margin-top:30px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.2s}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff}.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.2)}
.btn-sm{padding:6px 12px;font-size:12px}
.section-title{font-size:28px;font-weight:800;margin:40px 0 20px;font-family:'Shippori Mincho B1',serif}.section-count{color:var(--text-dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:60px}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:.3s;position:relative}.card:hover{transform:translateY(-6px);border-color:#b565ff}
.card-img{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#1d1430,#251a3a);object-fit:cover}.card-body{padding:14px}.card-title{font-weight:800;font-size:14px;margin-bottom:6px;font-family:'Shippori Mincho B1',serif}.card-meta{font-size:11px;color:var(--text-dim)}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:3}.card-btn{width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;border:none;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}.empty-icon{font-size:48px;margin-bottom:20px}
.pin-form{max-width:400px;margin:80px auto;background:var(--panel);padding:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);text-align:center}.pin-form h2{font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:20px}.pin-form p{color:var(--text-dim);margin-bottom:25px;font-size:14px}.pin-form input{width:100%;padding:12px;background:#0a0710;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:15px}
.panel{background:var(--panel);padding:25px;border-radius:12px;border:1px solid rgba(255,255,255,.1);margin-bottom:25px}.panel h3{font-family:'Shippori Mincho B1',serif;font-size:18px;margin-bottom:18px}
.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:10px;background:#0a0710;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--violet)}
.upload-area{border:2px dashed rgba(255,255,255,.3);border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:.2s;margin-top:10px}.upload-area:hover{border-color:var(--violet)}.upload-area input{display:none}
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--crimson),var(--violet));width:0%;transition:.15s}.progress-text{font-size:12px;color:var(--text-dim);margin-top:6px}
.social-icons{display:flex;gap:12px;margin-top:15px}.social-icon{width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;text-decoration:none;transition:.2s}.social-icon:hover{background:rgba(255,255,255,.2);color:#fff}
.footer{text-align:center;padding:40px 5vw 60px;color:var(--text-dim);font-size:12px;border-top:1px solid rgba(255,255,255,.1);margin-top:60px}
.chapter-item{background:rgba(255,255,255,.05);padding:12px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.chapter-item-title{cursor:pointer;flex:1}.chapter-item-actions{display:flex;gap:6px}.chapter-btn{width:28px;height:28px;border-radius:4px;background:rgba(255,255,255,.1);border:none;color:var(--text);cursor:pointer;font-size:11px}
.reader-page{width:100%;max-width:1000px;display:block;margin:0 auto 20px;border-radius:8px;border:1px solid rgba(255,255,255,.1)}.video-player{width:100%;aspect-ratio:16/9;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:#000;margin-bottom:20px}
.notice{padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--text-dim);font-size:12px;margin-bottom:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.list{display:grid;gap:10px}.manage-row{display:flex;justify-content:space-between;gap:12px;align-items:center;background:rgba(255,255,255,.04);padding:12px;border-radius:8px}.manage-actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:800px){.nav-right{float:none;margin-top:15px}.hero h1{font-size:36px}.row{grid-template-columns:1fr}.tabs{gap:7px}.tab{padding:7px 10px}}
</style>
</head>
<body>
<nav>
  <div class="brand" onclick="app.goHome()"><div class="brand-logo" id="logo-display">🦊</div><div class="brand-text">Kitsune AniVerse</div></div>
  <div class="nav-right">
    <div class="tabs">
      <button class="tab active" id="tab-home" onclick="app.view='home';app.render()">Library</button>
      <button class="tab" id="tab-upload" onclick="app.view='upload';app.render()">+ Add Content</button>
      <button class="tab" id="tab-admin" style="display:none" onclick="app.view='admin';app.render()">⚙️ Admin</button>
    </div>
    <div class="user-menu" id="user-menu" style="display:none" onclick="app.toggleUserMenu()"><div class="user-avatar" id="user-avatar">U</div><span id="user-name">User</span></div>
    <div id="user-dropdown" style="position:absolute;top:70px;right:20px;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 0;display:none;z-index:40;min-width:150px"><div style="padding:8px 16px;cursor:pointer;font-size:12px" onclick="app.logout()">Logout</div></div>
  </div>
</nav>
<div class="content" id="content"></div>
<div class="footer"><div class="social-icons" id="social-icons"></div><div style="margin-top:15px">狐 Kitsune AniVerse — Original manga, art &amp; content portal</div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import {getFirestore,collection,addDoc,getDocs,getDoc,doc,updateDoc,deleteDoc,setDoc,query,where,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import {getAuth,signInWithPopup,GoogleAuthProvider,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const firebaseConfig={
  apiKey:"AIzaSyCSOp-P6Wec72xmjE581dOVmheJ-ytQf2w",
  authDomain:"kitsune-aniverse.firebaseapp.com",
  projectId:"kitsune-aniverse",
  storageBucket:"kitsune-aniverse.firebasestorage.app",
  messagingSenderId:"73724605125",
  appId:"1:73724605125:web:8f6a0577ada949a26f36ac"
};
const fapp=initializeApp(firebaseConfig),db=getFirestore(fapp),auth=getAuth(fapp);
const ADMIN_EMAIL='admin@kitsuneaniverse.com';

window.app={
 view:'home',user:null,isAdmin:false,series:[],currentSeries:null,currentChapters:[],currentContent:null,pageIdx:0,
 settings:{logoUrl:'',facebook:'',youtube:'',instagram:''},editingSeriesId:null,editingChapterId:null,

 async boot(){
  onAuthStateChanged(auth,async u=>{
   this.user=u;this.isAdmin=!!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL);
   document.getElementById('user-menu').style.display=u?'flex':'none';
   document.getElementById('tab-admin').style.display=this.isAdmin?'block':'none';
   if(u){document.getElementById('user-avatar').textContent=(u.displayName||u.email||'U')[0].toUpperCase();document.getElementById('user-name').textContent=u.displayName?.split(' ')[0]||'User'}
   await this.loadSettings();await this.loadSeries();this.render();
  });
 },
 async loadSettings(){
  try{const s=await getDoc(doc(db,'settings','main'));if(s.exists())this.settings={...this.settings,...s.data()};this.applySettings()}catch(e){console.error(e)}
 },
 applySettings(){
  const logo=document.getElementById('logo-display');
  logo.innerHTML=this.settings.logoUrl?`<img src="${this.escapeAttr(this.settings.logoUrl)}" alt="Logo">`:'🦊';
  const icons=document.getElementById('social-icons');icons.innerHTML='';
  if(this.settings.facebook)icons.innerHTML+=`<a class="social-icon" href="${this.safeUrl(this.settings.facebook)}" target="_blank" rel="noopener noreferrer" title="Facebook">f</a>`;
  if(this.settings.youtube)icons.innerHTML+=`<a class="social-icon" href="${this.safeUrl(this.settings.youtube)}" target="_blank" rel="noopener noreferrer" title="YouTube">▶</a>`;
  if(this.settings.instagram)icons.innerHTML+=`<a class="social-icon" href="${this.safeUrl(this.settings.instagram)}" target="_blank" rel="noopener noreferrer" title="Instagram">◎</a>`;
 },
 async loadSeries(){
  try{const snap=await getDocs(collection(db,'series'));this.series=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))}catch(e){console.error(e)}
 },
 async googleLogin(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){alert('Login failed: '+e.message)}},
 async logout(){await signOut(auth);document.getElementById('user-dropdown').style.display='none';this.view='home'},
 toggleUserMenu(){const x=document.getElementById('user-dropdown');x.style.display=x.style.display==='none'?'block':'none'},
 goHome(){this.view='home';this.currentSeries=null;this.currentContent=null;this.render()},
 requireAdmin(){if(!this.isAdmin){alert('Admin access required.');return false}return true},

 render(){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  const active=this.view==='home'?'tab-home':this.view==='upload'?'tab-upload':'tab-admin';document.getElementById(active)?.classList.add('active');
  const el=document.getElementById('content');
  if(this.view==='home')el.innerHTML=this.renderHome();
  else if(this.view==='upload')el.innerHTML=this.isAdmin?this.renderUpload():this.renderLogin();
  else if(this.view==='admin')el.innerHTML=this.isAdmin?this.renderAdmin():'<div class="empty"><h3>Admin Only</h3></div>';
  if(this.view==='upload'&&this.isAdmin)this.wireUpload();
 },

 renderLogin(){return `<div class="pin-form"><h2>Welcome to Kitsune AniVerse</h2><p>Sign in with your Google/Gmail account to continue.</p><button class="btn btn-primary" style="width:100%" onclick="app.googleLogin()">Sign in with Google</button></div>`},

 renderHome(){
  const grid=this.series.length?`<div class="grid">${this.series.map(s=>`<div class="card" onclick="app.openSeries('${s.id}')">${s.coverUrl?`<img class="card-img" src="${this.escapeAttr(s.coverUrl)}" alt="">`:'<div class="card-img"></div>'}<div class="card-body"><div class="card-title">${this.escapeHtml(s.title)}</div><div class="card-meta">${s.chapterCount||0} chapters • ${this.escapeHtml(s.contentType||'manga')}</div></div></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">🦊</div><h3>No content yet</h3></div>`;
  return `<div class="hero"><h1>Tales spun in <span style="background:linear-gradient(120deg,#ff3b5c,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent">ink &amp; foxfire.</span></h1><p>Original manga, art &amp; content portal</p><div class="btns"><button class="btn btn-primary" onclick="document.querySelector('.section-title')?.scrollIntoView({behavior:'smooth'})">Browse ↓</button>${this.isAdmin?'<button class="btn btn-ghost" onclick="app.view=\'upload\';app.render()">+ Add Content</button>':''}</div></div><div class="section-title">Library <span class="section-count">${this.series.length} series</span></div>${grid}`
 },

 async openSeries(id){const s=this.series.find(x=>x.id===id);if(!s)return;this.currentSeries=s;this.pageIdx=0;await this.renderSeriesDetail()},
 async renderSeriesDetail(){
  if(!this.currentSeries)return;
  try{const snap=await getDocs(query(collection(db,'chapters'),where('seriesId','==',this.currentSeries.id)));this.currentChapters=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0))}catch(e){console.error(e)}
  document.getElementById('content').innerHTML=`<button class="btn btn-ghost" onclick="app.goHome()" style="margin-bottom:30px">← Back</button><h2 style="font-family:'Shippori Mincho B1',serif;font-size:28px;margin-bottom:15px">${this.escapeHtml(this.currentSeries.title)}</h2><p style="color:var(--text-dim);margin-bottom:30px;max-width:600px">${this.escapeHtml(this.currentSeries.description||'')}</p><h3 style="font-family:'Shippori Mincho B1',serif;margin-bottom:15px">Chapters (${this.currentChapters.length})</h3>${this.currentChapters.length?this.currentChapters.map(c=>`<div class="chapter-item"><div class="chapter-item-title" onclick="app.openChapter('${c.id}')"><strong>Chapter ${this.escapeHtml(String(c.number))}: ${this.escapeHtml(c.title||'')}</strong> • ${c.pageCount||0} ${c.contentType==='video'?'videos':'pages'}</div>${this.isAdmin?`<div class="chapter-item-actions"><button class="chapter-btn" onclick="app.editChapter('${c.id}')">✏️</button><button class="chapter-btn" onclick="app.deleteChapter('${c.id}')">🗑️</button></div>`:''}</div>`).join(''):'<div class="empty">No chapters</div>'}`;
 },
 async openChapter(id){
  try{const d=await getDoc(doc(db,'chapters',id));if(!d.exists())return;this.currentContent={...d.data(),id};this.pageIdx=0;const snap=await getDocs(query(collection(db,'pages'),where('chapterId','==',id)));const pages=snap.docs.map(x=>({...x.data(),id:x.id})).sort((a,b)=>(a.order||0)-(b.order||0));this.renderViewer(pages)}catch(e){alert('Could not open chapter: '+e.message)}
 },
 renderViewer(pages){
  const type=this.currentContent.contentType||'manga';let h=`<button class="btn btn-ghost" onclick="app.renderSeriesDetail()" style="margin-bottom:20px">← Back</button><p style="color:var(--text-dim);margin-bottom:15px">${this.escapeHtml(this.currentContent.title||'Chapter')} • ${pages.length} ${type==='video'?'videos':'pages'}</p>`;
  if(type==='video'){
   pages.forEach(p=>{const u=p.url||'';if(/youtube\.com|youtu\.be/.test(u)){const id=u.match(/(?:v=|youtu\.be\/)([^&?#]+)/)?.[1];if(id)h+=`<iframe class="video-player" src="https://www.youtube.com/embed/${this.escapeAttr(id)}" allowfullscreen></iframe>`}else if(u)h+=`<video class="video-player" controls preload="metadata"><source src="${this.escapeAttr(u)}"></video>`})
  }else if(pages.length){const p=pages[this.pageIdx]||pages[0];h+=`<img class="reader-page" src="${this.escapeAttr(p.url)}" alt="Page ${this.pageIdx+1}"><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-ghost" onclick="app.prevPage()" ${this.pageIdx<=0?'disabled':''}>← Prev</button><span style="align-self:center;color:var(--text-dim);font-size:12px">Page ${this.pageIdx+1} / ${pages.length}</span><button class="btn btn-ghost" onclick="app.nextPage(${pages.length})" ${this.pageIdx>=pages.length-1?'disabled':''}>Next →</button></div>`}
  document.getElementById('content').innerHTML=h;
 },
 nextPage(n){if(this.pageIdx<n-1){this.pageIdx++;this.openChapter(this.currentContent.id)}},prevPage(){if(this.pageIdx>0){this.pageIdx--;this.openChapter(this.currentContent.id)}},

 renderUpload(){
  return `<h2 style="font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:30px">📝 Add Content</h2>
  <div class="panel"><h3>🦊 Series</h3><div class="field"><label>Series title</label><input id="series-title" placeholder="Example: My Manga"></div><div class="field"><label>Description</label><textarea id="series-desc"></textarea></div><div class="field"><label>Series type</label><select id="series-type"><option value="manga">Manga</option><option value="video">Video</option><option value="mixed">Mixed</option></select></div><div class="field"><label>Cover image URL (optional)</label><input id="series-cover" placeholder="https://raw.githubusercontent.com/.../cover.jpg"></div><div class="notice">Free-plan setup: upload your image to GitHub first, then paste its direct image URL here.</div><button class="btn btn-primary" onclick="app.createSeries()">Create Series</button><div id="series-msg" class="progress-text"></div></div>
  <div class="panel"><h3>📚 New Chapter / Post</h3><div class="notice">First select an existing series. For manga, paste one direct image URL per line. For video, paste a YouTube or direct video URL. No Firebase Storage is used.</div><div class="field"><label>Existing series</label><select id="chapter-series"><option value="">— Select series —</option>${this.series.map(s=>`<option value="${s.id}">${this.escapeHtml(s.title)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Chapter number</label><input id="chapter-number" type="number" min="0" step="1" placeholder="1"></div><div class="field"><label>Chapter title</label><input id="chapter-title" placeholder="Chapter 1"></div></div><div class="field"><label>Content type</label><select id="chapter-type" onchange="app.toggleUploadMode()"><option value="manga">Manga / Images</option><option value="image">Image</option><option value="video">Video</option></select></div><div class="field" id="image-file-wrap"><label>Direct image URLs — one per line</label><textarea id="chapter-urls" placeholder="https://raw.githubusercontent.com/USERNAME/REPO/main/chapter-1/001.jpg&#10;https://raw.githubusercontent.com/USERNAME/REPO/main/chapter-1/002.jpg"></textarea></div><div class="field" id="video-file-wrap" style="display:none"><label>Video URL</label><input id="video-url" placeholder="https://www.youtube.com/watch?v=... or https://...mp4"></div><button class="btn btn-primary" id="save-chapter-btn" onclick="app.createChapter()">Save Chapter</button><div class="progress-text" id="upload-status">Ready</div></div>`;
 },
 wireUpload(){},
 toggleUploadMode(){const t=document.getElementById('chapter-type').value,v=t==='video';document.getElementById('image-file-wrap').style.display=v?'none':'block';document.getElementById('video-file-wrap').style.display=v?'block':'none'},

 async createSeries(){
  if(!this.requireAdmin())return;const title=document.getElementById('series-title').value.trim();if(!title)return alert('Enter a series title');
  const dup=this.series.some(s=>String(s.title||'').trim().toLowerCase()===title.toLowerCase());if(dup)return alert('A series with this name already exists.');
  const msg=document.getElementById('series-msg');msg.textContent='Saving series...';
  try{
   const coverUrl=document.getElementById('series-cover').value.trim();
   if(coverUrl&&!/^https?:\/\//i.test(coverUrl))throw new Error('Cover image URL must start with http:// or https://');
   await addDoc(collection(db,'series'),{title,description:document.getElementById('series-desc').value.trim(),contentType:document.getElementById('series-type').value,coverUrl,chapterCount:0,createdAt:serverTimestamp()});
   msg.textContent='Series saved ✓';await this.loadSeries();this.render();
  }catch(e){msg.textContent='Error: '+e.message}
 },
 async createChapter(){
  if(!this.requireAdmin())return;const sid=document.getElementById('chapter-series').value;if(!sid)return alert('Please select an existing series first.');
  const num=document.getElementById('chapter-number').value.trim(),title=document.getElementById('chapter-title').value.trim();if(!num||!title)return alert('Enter chapter number and title.');
  const type=document.getElementById('chapter-type').value;const existing=await getDocs(query(collection(db,'chapters'),where('seriesId','==',sid),where('number','==',Number(num))));if(!existing.empty)return alert('That chapter number already exists in this series.');
  const btn=document.getElementById('save-chapter-btn');btn.disabled=true;const status=document.getElementById('upload-status');let pageCount=0;
  try{
   const chapterRef=await addDoc(collection(db,'chapters'),{seriesId:sid,number:Number(num),title,contentType:type,pageCount:0,fileUrl:'',createdAt:serverTimestamp()});
   const addPage=async(url,order,name)=>{await addDoc(collection(db,'pages'),{chapterId:chapterRef.id,url,order,name:name||'',createdAt:serverTimestamp()});pageCount++};
   if(type==='video'){
    const vu=document.getElementById('video-url').value.trim();
    if(!vu||!/^https?:\/\//i.test(vu))throw new Error('Enter a valid video URL.');
    await addPage(vu,0,'Video URL');
   }else{
    const urls=document.getElementById('chapter-urls').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!urls.length)throw new Error('Paste at least one image URL.');
    for(let i=0;i<urls.length;i++){if(!/^https?:\/\//i.test(urls[i]))throw new Error(`Invalid image URL on line ${i+1}.`);await addPage(urls[i],i,`Page ${i+1}`)}
   }
   await updateDoc(doc(db,'chapters',chapterRef.id),{pageCount});
   const sref=doc(db,'series',sid),sd=await getDoc(sref);if(sd.exists())await updateDoc(sref,{chapterCount:(sd.data().chapterCount||0)+1});
   status.textContent='Chapter saved successfully ✓';await this.loadSeries();this.view='home';this.render();
  }catch(e){status.textContent='Error: '+e.message;try{await deleteDoc(doc(db,'chapters',this.currentContent?.id||'___'))}catch(_){} }
  finally{btn.disabled=false}
 },

 renderAdmin(){
  return `<h2 style="font-family:'Shippori Mincho B1',serif;font-size:28px;margin-bottom:25px">⚙️ Admin</h2>
  <div class="panel"><h3>Custom Logo & Social Links</h3><div class="field"><label>Logo image URL</label><input id="setting-logo" value="${this.escapeAttr(this.settings.logoUrl||'')}" placeholder="https://..."></div><div class="notice">Free-plan setup: use a direct logo image URL (for example, a GitHub raw URL). Firebase Storage is not used.</div><div class="row"><div class="field"><label>Facebook Page URL</label><input id="setting-facebook" value="${this.escapeAttr(this.settings.facebook||'')}"></div><div class="field"><label>YouTube Channel URL</label><input id="setting-youtube" value="${this.escapeAttr(this.settings.youtube||'')}"></div></div><div class="field"><label>Instagram URL</label><input id="setting-instagram" value="${this.escapeAttr(this.settings.instagram||'')}"></div><button class="btn btn-primary" onclick="app.saveSettings()">Save Settings</button><div id="settings-status" class="progress-text"></div></div>
  <div class="panel"><h3>Manage Series</h3><div class="list">${this.series.map(s=>`<div class="manage-row"><div><strong>${this.escapeHtml(s.title)}</strong><div class="card-meta">${s.chapterCount||0} chapters</div></div><div class="manage-actions"><button class="btn btn-ghost btn-sm" onclick="app.editSeries('${s.id}')">Edit</button><button class="btn btn-ghost btn-sm" onclick="app.deleteSeries('${s.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No series</div>'}</div></div>`;
 },
 async saveSettings(){
  if(!this.requireAdmin())return;const st=document.getElementById('settings-status');st.textContent='Saving...';let logo=document.getElementById('setting-logo').value.trim();try{if(logo&&!/^https?:\/\//i.test(logo))throw new Error('Logo URL must start with http:// or https://');this.settings={logoUrl:logo,facebook:document.getElementById('setting-facebook').value.trim(),youtube:document.getElementById('setting-youtube').value.trim(),instagram:document.getElementById('setting-instagram').value.trim()};await setDoc(doc(db,'settings','main'),this.settings,{merge:true});this.applySettings();st.textContent='Saved ✓';}catch(e){st.textContent='Error: '+e.message}},
 async editSeries(id){
  if(!this.requireAdmin())return;const s=this.series.find(x=>x.id===id);if(!s)return;const title=prompt('Series name:',s.title||'');if(title===null)return;const desc=prompt('Description:',s.description||'');if(desc===null)return;const cover=prompt('Cover URL (leave unchanged if blank):',s.coverUrl||'');if(cover===null)return;try{const data={title:title.trim(),description:desc};if(cover.trim())data.coverUrl=cover.trim();await updateDoc(doc(db,'series',id),data);await this.loadSeries();this.render()}catch(e){alert('Edit failed: '+e.message)}},
 async deleteSeries(id){
  if(!this.requireAdmin())return;const s=this.series.find(x=>x.id===id);if(!s)return;if(!confirm(`Delete "${s.title}"?\n\nThis will delete the series and its chapter/page database records. Continue?`))return;
  try{const cs=await getDocs(query(collection(db,'chapters'),where('seriesId','==',id)));for(const c of cs.docs){const ps=await getDocs(query(collection(db,'pages'),where('chapterId','==',c.id)));for(const p of ps.docs)await deleteDoc(p.ref);await deleteDoc(c.ref)}await deleteDoc(doc(db,'series',id));await this.loadSeries();this.goHome()}catch(e){alert('Delete failed: '+e.message)}},
 async editChapter(id){
  if(!this.requireAdmin())return;const d=await getDoc(doc(db,'chapters',id));if(!d.exists())return;const c={...d.data(),id};const n=prompt('Chapter number:',c.number);if(n===null)return;const t=prompt('Chapter title:',c.title||'');if(t===null)return;try{await updateDoc(doc(db,'chapters',id),{number:Number(n),title:t.trim()});if(this.currentSeries)await this.renderSeriesDetail();}catch(e){alert('Edit failed: '+e.message)}},
 async deleteChapter(id){
  if(!this.requireAdmin())return;if(!confirm('Delete ONLY this chapter?\n\nThe rest of the series will remain.'))return;try{const d=await getDoc(doc(db,'chapters',id));if(!d.exists())return;const c=d.data();const ps=await getDocs(query(collection(db,'pages'),where('chapterId','==',id)));for(const p of ps.docs)await deleteDoc(p.ref);await deleteDoc(doc(db,'chapters',id));const sr=doc(db,'series',c.seriesId),sd=await getDoc(sr);if(sd.exists())await updateDoc(sr,{chapterCount:Math.max(0,(sd.data().chapterCount||0)-1)});if(this.currentSeries)await this.renderSeriesDetail()}catch(e){alert('Delete failed: '+e.message)}},
 escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))},
 escapeAttr(s){return this.escapeHtml(s)},
 safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?this.escapeAttr(u.href):'#'}catch{return '#'}},
 safeFileName(s){return String(s).replace(/[^a-zA-Z0-9._-]/g,'_').slice(-180)}
};
app.boot();
</script>
</body>
