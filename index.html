<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitsune AniVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0710;--panel:#140e1f;--crimson:#d21f3c;--violet:#8b2fd6;--text:#f3ecfa;--text-dim:#a294bd;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--void);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;}
nav{padding:20px 5vw;border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:30;background:rgba(10,7,16,0.9);}
.brand{font-family:'Shippori Mincho B1',serif;font-size:22px;font-weight:800;background:linear-gradient(90deg,#fff,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;}
.tabs{display:flex;gap:20px;margin-top:15px;}
.tab{padding:10px 20px;border-radius:8px;background:var(--panel);cursor:pointer;font-weight:700;transition:.2s;border:none;}
.tab.active{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;}
.content{padding:40px 5vw;max-width:1400px;margin:0 auto;}
.hero{margin:60px 0 80px;}
.hero h1{font-size:48px;font-family:'Shippori Mincho B1',serif;margin-bottom:20px;line-height:1.2;}
.hero p{font-size:16px;color:var(--text-dim);max-width:600px;line-height:1.7;}
.btns{display:flex;gap:15px;margin-top:30px;flex-wrap:wrap;}
.btn{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.2s;}
.btn-primary{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;}
.btn-primary:hover{transform:translateY(-2px);}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,0.2);}
.section-title{font-size:28px;font-weight:800;margin:40px 0 20px;font-family:'Shippori Mincho B1',serif;}
.section-count{color:var(--text-dim);font-size:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:60px;}
.card{background:var(--panel);border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:.3s;}
.card:hover{transform:translateY(-6px);border-color:#b565ff;}
.card-img{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#1d1430,#251a3a);object-fit:cover;}
.card-body{padding:14px;}
.card-title{font-weight:800;font-size:14px;margin-bottom:6px;font-family:'Shippori Mincho B1',serif;}
.card-meta{font-size:11px;color:var(--text-dim);}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-icon{font-size:48px;margin-bottom:20px;}
.loading{text-align:center;padding:40px;color:var(--text-dim);}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pin-form{max-width:400px;margin:80px auto;background:var(--panel);padding:40px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);text-align:center;}
.pin-form h2{font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:20px;}
.pin-form p{color:var(--text-dim);margin-bottom:25px;font-size:14px;}
.pin-form input{width:100%;padding:12px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:15px;}
.pin-form button{width:100%;padding:12px;background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;}
.footer{text-align:center;padding:40px 5vw 60px;color:var(--text-dim);font-size:12px;border-top:1px solid rgba(255,255,255,0.1);margin-top:60px;}
</style>
</head>
<body>

<nav>
<div class="brand" onclick="app.goHome()">🦊 Kitsune AniVerse</div>
<div class="tabs">
<button class="tab active" id="tab-home" onclick="app.showView('home')">Library</button>
<button class="tab" id="tab-upload" onclick="app.showView('upload')">+ Add Content</button>
</div>
</nav>

<div class="content" id="content"></div>

<div class="footer">
📺 Channel: Kitsune AniVerse | 📘 Facebook: Kitsune AniVerse<br>
狐 Original manga &amp; art portal
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, deleteDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCSOp-P6Wec72xmjE581dOVmheJ-ytQf2w",
  authDomain: "kitsune-aniverse.firebaseapp.com",
  projectId: "kitsune-aniverse",
  storageBucket: "kitsune-aniverse.firebasestorage.app",
  messagingSenderId: "73724605125",
  appId: "1:73724605125:web:8f6a0577ada949a26f36ac"
};

try {
  const fapp = initializeApp(firebaseConfig);
  const db = getFirestore(fapp);
  const auth = getAuth(fapp);
  signInAnonymously(auth).catch(console.error);

  window.app = {
    view: 'home',
    series: [],
    currentSeries: null,
    currentChapters: [],
    currentPages: [],
    pageIdx: 0,
    pinOk: localStorage.getItem('kitsune-pin-ok') === 'true',
    db, auth,

    async boot(){
      try {
        const snap = await getDocs(collection(db, 'series'));
        this.series = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      } catch(e) { console.error('Load failed:', e); }
      this.render();
    },

    showView(v){
      this.view = v;
      document.getElementById('tab-home').classList.toggle('active', v === 'home');
      document.getElementById('tab-upload').classList.toggle('active', v === 'upload');
      this.render();
    },

    render(){
      const el = document.getElementById('content');
      if(this.view === 'home') el.innerHTML = this.renderHome();
      else if(this.view === 'upload') el.innerHTML = this.pinOk ? this.renderUpload() : this.renderPin();
      
      if(this.view === 'upload') setTimeout(() => this.wireUpload(), 100);
    },

    renderHome(){
      const grid = this.series.length ? `<div class="grid">${this.series.map(s => `
        <div class="card" onclick="app.openSeries('${s.id}')">
          ${s.coverUrl ? `<img class="card-img" src="${s.coverUrl}"/>` : `<div class="card-img"></div>`}
          <div class="card-body">
            <div class="card-title">${this.escapeHtml(s.title)}</div>
            <div class="card-meta">${s.chapterCount || 0} chapters</div>
          </div>
        </div>
      `).join('')}</div>` : `<div class="empty"><div class="empty-icon">🦊</div><h3>No series yet</h3></div>`;
      
      return `
        <div class="hero">
          <h1>Tales spun in <span style="background:linear-gradient(120deg,#ff3b5c,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent;">ink &amp; foxfire.</span></h1>
          <p>Kitsune AniVerse — original manga and art, straight from the creator's desk.</p>
          <div class="btns">
            <button class="btn btn-primary" onclick="document.querySelector('.section-title').scrollIntoView({behavior:'smooth'})">Browse Library ↓</button>
            <button class="btn btn-ghost" onclick="app.showView('upload')">+ Add Series</button>
          </div>
        </div>
        <div class="section-title">Library <span class="section-count">${this.series.length} series</span></div>
        ${grid}
      `;
    },

    renderPin(){
      return `
        <div class="pin-form">
          <h2>🔒 Creator Area</h2>
          <p>${localStorage.getItem('kitsune-pin') ? 'Enter PIN to continue' : 'Create a PIN to add content'}</p>
          <input type="password" id="pin-input" placeholder="PIN" autofocus>
          <button onclick="app.checkPin()">Continue</button>
        </div>
      `;
    },

    checkPin(){
      const val = document.getElementById('pin-input').value.trim();
      if(!val){ alert('Enter PIN'); return; }
      const saved = localStorage.getItem('kitsune-pin');
      if(!saved){
        localStorage.setItem('kitsune-pin', val);
        this.pinOk = true;
        localStorage.setItem('kitsune-pin-ok', 'true');
        this.render();
      } else if(val === saved){
        this.pinOk = true;
        localStorage.setItem('kitsune-pin-ok', 'true');
        this.render();
      } else {
        alert('Wrong PIN');
      }
    },

    renderUpload(){
      return `
        <h2 style="font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:40px;">📝 Add Content</h2>
        
        <div style="background:var(--panel);padding:30px;border-radius:12px;margin-bottom:30px;border:1px solid rgba(255,255,255,0.1);">
          <h3 style="font-family:'Shippori Mincho B1',serif;font-size:18px;margin-bottom:20px;">🦊 New Series</h3>
          <input type="text" id="f-title" placeholder="Title" style="width:100%;padding:10px;margin-bottom:15px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);">
          <textarea id="f-desc" placeholder="Description" style="width:100%;padding:10px;margin-bottom:15px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);min-height:80px;"></textarea>
          <input type="file" id="f-cover" accept="image/*" style="display:block;margin-bottom:15px;">
          <button class="btn btn-primary" id="btn-series" style="width:100%;" onclick="app.saveSeries()">Save Series</button>
        </div>

        <div style="background:var(--panel);padding:30px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);">
          <h3 style="font-family:'Shippori Mincho B1',serif;font-size:18px;margin-bottom:20px;">📖 Add Chapter</h3>
          <select id="f-series" style="width:100%;padding:10px;margin-bottom:15px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);">
            <option value="">— Choose Series —</option>
            ${this.series.map(s => `<option value="${s.id}">${this.escapeHtml(s.title)}</option>`).join('')}
          </select>
          <input type="number" id="f-num" value="1" placeholder="Chapter #" style="width:100%;padding:10px;margin-bottom:15px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);">
          <input type="text" id="f-ch-title" placeholder="Chapter Title" style="width:100%;padding:10px;margin-bottom:15px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);">
          <input type="file" id="f-pages" accept="image/*" multiple style="display:block;margin-bottom:15px;">
          <button class="btn btn-primary" id="btn-chapter" style="width:100%;" onclick="app.saveChapter()">Save Chapter</button>
        </div>

        <div style="text-align:center;margin-top:40px;">
          <button class="btn btn-ghost" onclick="app.pinOk=false;localStorage.removeItem('kitsune-pin-ok');app.render()">Logout</button>
        </div>
      `;
    },

    async openSeries(id){
      const doc = await getDoc(doc(db, 'series', id));
      if(!doc.exists()) return;
      this.currentSeries = {...doc.data(), id};
      const snap = await getDocs(query(collection(db, 'chapters'), where('seriesId', '==', id)));
      this.currentChapters = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => a.number - b.number);
      this.showChapters();
    },

    showChapters(){
      const el = document.getElementById('content');
      el.innerHTML = `
        <button class="btn btn-ghost" style="margin-bottom:30px;" onclick="app.showView('home')">← Back</button>
        <h2 style="font-family:'Shippori Mincho B1',serif;font-size:28px;margin-bottom:20px;">${this.escapeHtml(this.currentSeries.title)}</h2>
        <p style="color:var(--text-dim);margin-bottom:30px;">${this.escapeHtml(this.currentSeries.description || '')}</p>
        <h3 style="font-family:'Shippori Mincho B1',serif;font-size:20px;margin-bottom:20px;">Chapters (${this.currentChapters.length})</h3>
        ${this.currentChapters.length ? this.currentChapters.map(c => `
          <div style="background:var(--panel);padding:15px;margin-bottom:10px;border-radius:8px;cursor:pointer;" onclick="app.openChapter('${c.id}')">
            <strong>Chapter ${c.number}: ${this.escapeHtml(c.title)}</strong><br>
            <span style="color:var(--text-dim);font-size:12px;">${c.pageCount || 0} pages</span>
          </div>
        `).join('') : '<div class="empty">No chapters yet</div>'}
      `;
    },

    async openChapter(id){
      const doc = await getDoc(doc(db, 'chapters', id));
      this.currentChapter = {...doc.data(), id};
      const snap = await getDocs(query(collection(db, 'pages'), where('chapterId', '==', id)));
      this.currentPages = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => a.order - b.order).map(p => p.url);
      this.pageIdx = 0;
      this.showReader();
    },

    showReader(){
      if(!this.currentPages.length) return;
      const el = document.getElementById('content');
      el.innerHTML = `
        <button class="btn btn-ghost" style="margin-bottom:20px;" onclick="app.showChapters()">← Back</button>
        <p style="color:var(--text-dim);margin-bottom:20px;">${this.escapeHtml(this.currentChapter.title)} — Page ${this.pageIdx + 1} / ${this.currentPages.length}</p>
        <img src="${this.currentPages[this.pageIdx]}" style="width:100%;border-radius:8px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex;gap:10px;justify-content:center;">
          <button class="btn btn-ghost" onclick="app.prevPage()" ${this.pageIdx === 0 ? 'disabled' : ''}>← Prev</button>
          <button class="btn btn-ghost" onclick="app.nextPage()" ${this.pageIdx === this.currentPages.length-1 ? 'disabled' : ''}>Next →</button>
        </div>
      `;
    },

    nextPage(){ if(this.pageIdx < this.currentPages.length-1){ this.pageIdx++; this.showReader(); } },
    prevPage(){ if(this.pageIdx > 0){ this.pageIdx--; this.showReader(); } },
    goHome(){ this.showView('home'); },

    async saveSeries(){
      const title = document.getElementById('f-title').value.trim();
      if(!title) { alert('Enter title'); return; }
      const btn = document.getElementById('btn-series');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const desc = document.getElementById('f-desc').value.trim();
        const cover = document.getElementById('f-cover').files[0];
        let coverUrl = null;
        if(cover){
          const reader = new FileReader();
          coverUrl = await new Promise(resolve => {
            reader.onload = e => resolve(e.target.result);
            reader.readAsDataURL(cover);
          });
        }
        await addDoc(collection(db, 'series'), {
          title, description: desc, coverUrl, chapterCount: 0, createdAt: new Date().toISOString()
        });
        alert('Series created!');
        document.getElementById('f-title').value = '';
        document.getElementById('f-desc').value = '';
        this.boot();
      } catch(e) { alert('Error: ' + e.message); }
      btn.disabled = false;
      btn.textContent = 'Save Series';
    },

    async saveChapter(){
      const seriesId = document.getElementById('f-series').value;
      if(!seriesId) { alert('Choose series'); return; }
      const files = document.getElementById('f-pages').files;
      if(!files.length) { alert('Choose pages'); return; }
      const btn = document.getElementById('btn-chapter');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const num = parseFloat(document.getElementById('f-num').value) || 1;
        const title = document.getElementById('f-ch-title').value.trim() || `Chapter ${num}`;
        const chapRef = await addDoc(collection(db, 'chapters'), {
          seriesId, number: num, title, pageCount: files.length, createdAt: new Date().toISOString()
        });
        for(let i = 0; i < files.length; i++){
          const reader = new FileReader();
          const url = await new Promise(resolve => {
            reader.onload = e => resolve(e.target.result);
            reader.readAsDataURL(files[i]);
          });
          await addDoc(collection(db, 'pages'), {
            chapterId: chapRef.id, order: i, url
          });
        }
        alert('Chapter saved!');
        this.boot();
      } catch(e) { alert('Error: ' + e.message); }
      btn.disabled = false;
      btn.textContent = 'Save Chapter';
    },

    wireUpload(){},
    escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  };

  app.boot();
} catch(e) {
  document.getElementById('content').innerHTML = `<div class="loading" style="color:red;">Firebase Error: ${e.message}<br>Check console</div>`;
  console.error('ERROR:', e);
}
</script>

</body>
</html>
