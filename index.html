<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitsune AniVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
<style>
:root{--void:#0a0710;--panel:#140e1f;--crimson:#d21f3c;--violet:#8b2fd6;--text:#f3ecfa;--text-dim:#a294bd;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--void);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;}
nav{padding:20px 5vw;border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:30;background:rgba(10,7,16,0.9);}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-logo{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--crimson),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;overflow:hidden;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.brand-text{font-family:'Shippori Mincho B1',serif;font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-right{display:flex;align-items:center;gap:20px;}
.tabs{display:flex;gap:15px;}
.tab{padding:8px 16px;border-radius:6px;background:var(--panel);cursor:pointer;font-weight:700;transition:.2s;border:none;font-size:13px;}
.tab.active{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;}
.user-menu{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-radius:6px;cursor:pointer;font-size:12px;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#b565ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;}
.content{padding:40px 5vw;max-width:1400px;margin:0 auto;}
.hero{margin:60px 0 80px;}
.hero h1{font-size:48px;font-family:'Shippori Mincho B1',serif;margin-bottom:20px;line-height:1.2;}
.hero p{font-size:16px;color:var(--text-dim);max-width:600px;line-height:1.7;}
.btns{display:flex;gap:15px;margin-top:30px;flex-wrap:wrap;}
.btn{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.2s;}
.btn-primary{background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;}
.btn-primary:hover{transform:translateY(-2px);}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,0.2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.section-title{font-size:28px;font-weight:800;margin:40px 0 20px;font-family:'Shippori Mincho B1',serif;}
.section-count{color:var(--text-dim);font-size:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:60px;}
.card{background:var(--panel);border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:.3s;position:relative;}
.card:hover{transform:translateY(-6px);border-color:#b565ff;}
.card-img{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#1d1430,#251a3a);object-fit:cover;}
.card-body{padding:14px;}
.card-title{font-weight:800;font-size:14px;margin-bottom:6px;font-family:'Shippori Mincho B1',serif;}
.card-meta{font-size:11px;color:var(--text-dim);}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;}
.card-btn{width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:12px;}
.empty{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-icon{font-size:48px;margin-bottom:20px;}
.pin-form{max-width:400px;margin:80px auto;background:var(--panel);padding:40px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);text-align:center;}
.pin-form h2{font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:20px;}
.pin-form p{color:var(--text-dim);margin-bottom:25px;font-size:14px;}
.pin-form input{width:100%;padding:12px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:15px;}
.pin-form button{width:100%;padding:12px;background:linear-gradient(135deg,var(--crimson),var(--violet));color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;}
.panel{background:var(--panel);padding:25px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);margin-bottom:25px;}
.panel h3{font-family:'Shippori Mincho B1',serif;font-size:18px;margin-bottom:18px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;}
.field input, .field textarea, .field select{width:100%;padding:10px;background:#0a0710;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--violet);}
.upload-area{border:2px dashed rgba(255,255,255,0.3);border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:.2s;margin-top:10px;}
.upload-area:hover{border-color:var(--violet);}
.upload-area input{display:none;}
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--crimson),var(--violet));width:0%;transition:.2s;}
.progress-text{font-size:12px;color:var(--text-dim);margin-top:5px;}
.social-icons{display:flex;gap:12px;margin-top:15px;}
.social-icon{width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;text-decoration:none;transition:.2s;}
.social-icon:hover{background:rgba(255,255,255,0.2);color:#fff;}
.footer{text-align:center;padding:40px 5vw 60px;color:var(--text-dim);font-size:12px;border-top:1px solid rgba(255,255,255,0.1);margin-top:60px;}
.chapter-item{background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.chapter-item-title{cursor:pointer;flex:1;}
.chapter-item-actions{display:flex;gap:6px;}
.chapter-btn{width:28px;height:28px;border-radius:4px;background:rgba(255,255,255,0.1);border:none;color:var(--text);cursor:pointer;font-size:11px;}
.reader-page{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,0.1);margin-bottom:20px;}
.video-player{width:100%;aspect-ratio:16/9;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#000;margin-bottom:20px;}
</style>
</head>
<body>

<nav>
<div class="brand" onclick="app.goHome()">
  <div class="brand-logo" id="logo-display">🦊</div>
  <div class="brand-text">Kitsune AniVerse</div>
</div>
<div class="nav-right">
  <div class="tabs">
    <button class="tab active" id="tab-home" onclick="app.view='home'; app.render()">Library</button>
    <button class="tab" id="tab-upload" onclick="app.view='upload'; app.render()">+ Add Content</button>
    <button class="tab" id="tab-admin" style="display:none;" onclick="app.view='admin'; app.render()">⚙️ Admin</button>
  </div>
  <div class="user-menu" id="user-menu" style="display:none;" onclick="app.toggleUserMenu()">
    <div class="user-avatar" id="user-avatar">U</div>
    <span id="user-name">User</span>
  </div>
  <div id="user-dropdown" style="position:absolute;top:60px;right:20px;background:var(--panel);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 0;display:none;z-index:40;min-width:150px;">
    <div style="padding:8px 16px;cursor:pointer;font-size:12px;" onclick="app.logout()">Logout</div>
  </div>
</div>
</nav>

<div class="content" id="content"></div>

<div class="footer" id="footer">
  <div class="social-icons" id="social-icons"></div>
  <div style="margin-top:15px;">狐 Kitsune AniVerse — Original manga, art &amp; content portal</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, deleteDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
import { getStorage, ref, uploadBytes } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js';
import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCSOp-P6Wec72xmjE581dOVmheJ-ytQf2w",
  authDomain: "kitsune-aniverse.firebaseapp.com",
  projectId: "kitsune-aniverse",
  storageBucket: "kitsune-aniverse.firebasestorage.app",
  messagingSenderId: "73724605125",
  appId: "1:73724605125:web:8f6a0577ada949a26f36ac"
};

const fapp = initializeApp(firebaseConfig);
const db = getFirestore(fapp);
const storage = getStorage(fapp);
const auth = getAuth(fapp);

window.app = {
  view: 'home',
  user: null,
  isAdmin: false,
  series: [],
  currentSeries: null,
  currentChapters: [],
  currentContent: null,
  pageIdx: 0,
  settings: { logoUrl: null, facebook: '', youtube: '', instagram: '' },
  stagedFiles: [],

  async boot(){
    onAuthStateChanged(auth, async (u) => {
      this.user = u;
      if(u){
        document.getElementById('user-menu').style.display = 'flex';
        document.getElementById('user-avatar').textContent = u.displayName?.[0]?.toUpperCase() || 'U';
        document.getElementById('user-name').textContent = u.displayName?.split(' ')[0] || 'User';
        this.isAdmin = u.email === 'admin@kitsuneaniverse.com';
        if(this.isAdmin) document.getElementById('tab-admin').style.display = 'block';
      } else {
        document.getElementById('user-menu').style.display = 'none';
        document.getElementById('tab-admin').style.display = 'none';
      }
      await this.loadSettings();
      await this.loadSeries();
      this.render();
    });
  },

  async loadSettings(){
    try{
      const doc = await getDoc(doc(db, 'settings', 'main'));
      if(doc.exists()) this.settings = {...this.settings, ...doc.data()};
      if(this.settings.logoUrl) document.getElementById('logo-display').innerHTML = `<img src="${this.settings.logoUrl}"/>`;
      this.updateSocialLinks();
    }catch(e){ console.error(e); }
  },

  updateSocialLinks(){
    const icons = document.getElementById('social-icons');
    icons.innerHTML = '';
    if(this.settings.facebook) icons.innerHTML += `<a href="${this.settings.facebook}" target="_blank" class="social-icon" title="Facebook">f</a>`;
    if(this.settings.youtube) icons.innerHTML += `<a href="${this.settings.youtube}" target="_blank" class="social-icon" title="YouTube">▶</a>`;
    if(this.settings.instagram) icons.innerHTML += `<a href="${this.settings.instagram}" target="_blank" class="social-icon" title="Instagram">📷</a>`;
  },

  async loadSeries(){
    try{
      const snap = await getDocs(collection(db, 'series'));
      this.series = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    }catch(e){ console.error(e); }
  },

  async googleLogin(){
    try{
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }catch(e){ alert('Login failed: ' + e.message); }
  },

  async logout(){
    await signOut(auth);
    document.getElementById('user-dropdown').style.display = 'none';
  },

  toggleUserMenu(){
    const menu = document.getElementById('user-dropdown');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  },

  goHome(){ this.view = 'home'; this.render(); },

  render(){
    const el = document.getElementById('content');
    if(this.view === 'home') el.innerHTML = this.renderHome();
    else if(this.view === 'upload') el.innerHTML = this.user ? this.renderUpload() : this.renderLogin();
    else if(this.view === 'admin') el.innerHTML = this.isAdmin ? this.renderAdmin() : '<div class="empty"><h3>Admin Only</h3></div>';
    
    if(this.view === 'upload') this.wireUpload();
  },

  renderLogin(){
    return `
      <div class="pin-form">
        <h2>Welcome to Kitsune AniVerse</h2>
        <p>Sign in to upload and manage content</p>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="app.googleLogin()">
          Sign in with Google
        </button>
        <p style="font-size:12px;color:var(--text-dim);margin-top:15px;">Or use PIN access</p>
        <input type="password" id="pin-input" placeholder="PIN" style="margin-bottom:10px;">
        <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="app.pinLogin()">PIN Login</button>
      </div>
    `;
  },

  pinLogin(){
    const pin = document.getElementById('pin-input').value.trim();
    if(!pin){ alert('Enter PIN'); return; }
    const saved = localStorage.getItem('kitsune-pin');
    if(!saved){
      localStorage.setItem('kitsune-pin', pin);
      localStorage.setItem('kitsune-pin-ok', 'true');
      alert('PIN set!');
      this.render();
    } else if(pin === saved){
      localStorage.setItem('kitsune-pin-ok', 'true');
      this.render();
    } else {
      alert('Wrong PIN');
    }
  },

  renderHome(){
    const grid = this.series.length ? `<div class="grid">${this.series.map(s => `
      <div class="card">
        ${s.coverUrl ? `<img class="card-img" src="${s.coverUrl}"/>` : `<div class="card-img"></div>`}
        <div style="position:absolute;top:0;left:0;right:0;bottom:0;" onclick="app.openSeries('${s.id}')"></div>
        ${this.user ? `<div class="card-actions">
          <button class="card-btn" onclick="app.editSeries('${s.id}')">✏️</button>
          <button class="card-btn" onclick="app.deleteSeries('${s.id}')">🗑️</button>
        </div>` : ''}
        <div class="card-body">
          <div class="card-title">${this.escapeHtml(s.title)}</div>
          <div class="card-meta">${s.chapterCount || 0} chapters • ${s.contentType || 'manga'}</div>
        </div>
      </div>
    `).join('')}</div>` : `<div class="empty"><div class="empty-icon">🦊</div><h3>No content yet</h3></div>`;
    
    return `
      <div class="hero">
        <h1>Tales spun in <span style="background:linear-gradient(120deg,#ff3b5c,#b565ff);-webkit-background-clip:text;background-clip:text;color:transparent;">ink &amp; foxfire.</span></h1>
        <p>Original manga, art &amp; content portal</p>
        <div class="btns">
          <button class="btn btn-primary" onclick="document.querySelector('.section-title').scrollIntoView({behavior:'smooth'})">Browse ↓</button>
          ${this.user ? `<button class="btn btn-ghost" onclick="app.view='upload'; app.render()">+ Add Content</button>` : `<button class="btn btn-ghost" onclick="app.view='upload'; app.render()">Sign In</button>`}
        </div>
      </div>
      <div class="section-title">Library <span class="section-count">${this.series.length} series</span></div>
      ${grid}
    `;
  },

  openSeries(id){
    const s = this.series.find(x => x.id === id);
    if(!s) return;
    this.currentSeries = s;
    this.currentContent = null;
    this.renderSeriesDetail();
  },

  async renderSeriesDetail(){
    try{
      const snap = await getDocs(query(collection(db, 'chapters'), where('seriesId', '==', this.currentSeries.id)));
      this.currentChapters = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => a.number - b.number);
    }catch(e){ console.error(e); }
    
    const el = document.getElementById('content');
    el.innerHTML = `
      <button class="btn btn-ghost" style="margin-bottom:30px;" onclick="app.goHome()">← Back</button>
      <h2 style="font-family:'Shippori Mincho B1',serif;font-size:28px;margin-bottom:15px;">${this.escapeHtml(this.currentSeries.title)}</h2>
      <p style="color:var(--text-dim);margin-bottom:30px;max-width:600px;">${this.escapeHtml(this.currentSeries.description || '')}</p>
      <div style="margin-bottom:30px;">${this.currentSeries.tags ? this.currentSeries.tags.map(t => `<span style="display:inline-block;background:var(--panel);padding:4px 10px;border-radius:4px;font-size:11px;margin-right:8px;margin-bottom:8px;">${this.escapeHtml(t)}</span>`).join('') : ''}</div>
      <h3 style="font-family:'Shippori Mincho B1',serif;font-size:20px;margin-bottom:15px;">Chapters (${this.currentChapters.length})</h3>
      ${this.currentChapters.length ? `<div>${this.currentChapters.map(c => `
        <div class="chapter-item" onclick="app.openChapter('${c.id}')">
          <div class="chapter-item-title"><strong>Chapter ${c.number}: ${this.escapeHtml(c.title)}</strong> • ${c.pageCount || 0} pages</div>
          ${this.user ? `<div class="chapter-item-actions"><button class="chapter-btn" onclick="event.stopPropagation(); app.editChapter('${c.id}')">✏️</button><button class="chapter-btn" onclick="event.stopPropagation(); app.deleteChapter('${c.id}')">🗑️</button></div>` : ''}
        </div>
      `).join('')}</div>` : '<div class="empty">No chapters</div>'}
    `;
  },

  async openChapter(id){
    try{
      const doc = await getDoc(doc(db, 'chapters', id));
      this.currentContent = {...doc.data(), id};
      const snap = await getDocs(query(collection(db, 'pages'), where('chapterId', '==', id)));
      const pages = snap.docs.map(d => ({...d.data(), id: d.id})).sort((a,b) => a.order - b.order);
      this.renderViewer(pages);
    }catch(e){ console.error(e); }
  },

  renderViewer(pages){
    const el = document.getElementById('content');
    const type = this.currentContent.contentType || 'manga';
    
    let viewerHTML = `
      <button class="btn btn-ghost" style="margin-bottom:20px;" onclick="app.renderSeriesDetail()">← Back</button>
      <p style="color:var(--text-dim);margin-bottom:15px;">${this.escapeHtml(this.currentContent.title)} • ${pages.length} ${type === 'video' ? 'videos' : 'pages'}</p>
    `;

    if(type === 'manga' || type === 'image'){
      if(pages.length > 0){
        viewerHTML += `
          <img src="${pages[this.pageIdx]?.url || ''}" class="reader-page" style="max-height:600px;">
          <div style="display:flex;gap:10px;justify-content:center;">
            <button class="btn btn-ghost" onclick="app.prevPage()" ${this.pageIdx === 0 ? 'disabled' : ''}>← Prev</button>
            <span style="color:var(--text-dim);font-size:12px;align-self:center;">Page ${this.pageIdx + 1} / ${pages.length}</span>
            <button class="btn btn-ghost" onclick="app.nextPage()" ${this.pageIdx === pages.length - 1 ? 'disabled' : ''}>Next →</button>
          </div>
        `;
      }
    } else if(type === 'video'){
      if(pages[0]?.url){
        const url = pages[0].url;
        if(url.includes('youtube') || url.includes('youtu.be')){
          const vidId = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/)?.[1];
          viewerHTML += `<iframe class="video-player" src="https://www.youtube.com/embed/${vidId}" allowfullscreen></iframe>`;
        } else if(url.startsWith('http')){
          viewerHTML += `<video class="video-player" controls><source src="${url}"></video>`;
        } else {
          viewerHTML += `<video class="video-player" controls><source src="data:video/mp4;base64,${url}"></video>`;
        }
      }
    }

    el.innerHTML = viewerHTML;
  },

  nextPage(){ if(this.pageIdx < 10) this.pageIdx++; this.openChapter(this.currentContent.id); },
  prevPage(){ if(this.pageIdx > 0) this.pageIdx--; this.openChapter(this.currentContent.id); },

  renderUpload(){
    if(!this.user && !localStorage.getItem('kitsune-pin-ok')) return this.renderLogin();

    return `
      <h2 style="font-family:'Shippori Mincho B1',serif;font-size:24px;margin-bottom:30px;">📝 Add Content</h2>
      
      <div class="panel">
        <h3>🦊 New Series</h3>
        <div class="field"><label>Title</label><input type="text" id="f-title" placeholder="Series title"></div>
        <div class="field"><label>Description</label><textarea id="f-desc" placeholder="About this series" style="min-height:80px;"></textarea></div>
        <div class="field"><label>Tags</label><input type="text" id="f-tags" placeholder="manga, action, fantasy"></div>
        <div class="field"><label>Cover Image</label>
          <div class="upload-area" onclick="document.getElementById('f-cover').click()">
            <div id="cover-text">Click to upload cover image</div>
            <input type="file" id="f-cover" accept="image/*">
          </div>
        </div>
        <button class="btn btn-primary" id="btn-series" style="width:100%;justify-content:center;" onclick="app.saveSeries()">Create Series</button>
      </div>

      <div class="panel">
        <h3>📖 Add Chapter/Content</h3>
        <div class="field"><label>Series</label>
          <select id="f-series">
            <option value="">— Choose Series —</option>
            ${this.series.map(s => `<option value="${s.id}">${this.escapeHtml(s.title)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Content Type</label>
          <select id="f-type" onchange="document.getElementById('upload-hint').textContent = {manga:'Upload PDF or manga images',image:'Upload JPG, PNG, or WebP images',video:'Upload video file or paste URL'}[this.value] || ''">
            <option value="manga">Manga / PDF</option>
            <option value="image">Image Gallery</option>
            <option value="video">Video</option>
          </select>
          <div id="upload-hint" style="font-size:11px;color:var(--text-dim);margin-top:5px;">Upload PDF or manga images</div>
        </div>
        <div class="field"><label>Chapter #</label><input type="number" id="f-num" value="1"></div>
        <div class="field"><label>Chapter Title</label><input type="text" id="f-title2" placeholder="e.g. The Beginning"></div>
        <div class="field"><label id="upload-label">Pages / Files</label>
          <div class="upload-area" onclick="document.getElementById('f-files').click()">
            <div id="files-text">Click to upload files (multiple)</div>
            <input type="file" id="f-files" accept="image/*,video/*,.pdf" multiple>
          </div>
          <div class="progress-bar" id="progress" style="display:none;"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-text" id="progress-text"></div>
        </div>
        <div id="file-list" style="margin-top:10px;"></div>
        <button class="btn btn-primary" id="btn-chapter" style="width:100%;justify-content:center;margin-top:15px;" onclick="app.saveChapter()">Upload Chapter</button>
      </div>
    `;
  },

  renderAdmin(){
    return `
      <h2 style="font-family:'Shippori Mincho B1',serif;font-size:28px;margin-bottom:30px;">⚙️ Admin Settings</h2>
      
      <div class="panel">
        <h3>🎨 Website Logo</h3>
        <p style="font-size:13px;color:var(--text-dim);margin-bottom:15px;">Upload a custom logo (PNG, JPG, WebP)</p>
        <div class="upload-area" onclick="document.getElementById('logo-file').click()">
          <div id="logo-text">Click to upload logo</div>
          <input type="file" id="logo-file" accept="image/*">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:15px;" onclick="app.uploadLogo()">Update Logo</button>
      </div>

      <div class="panel">
        <h3>📱 Social Media URLs</h3>
        <div class="field"><label>Facebook Page URL</label><input type="url" id="facebook-url" placeholder="https://facebook.com/..." value="${this.settings.facebook}"></div>
        <div class="field"><label>YouTube Channel URL</label><input type="url" id="youtube-url" placeholder="https://youtube.com/..." value="${this.settings.youtube}"></div>
        <div class="field"><label>Instagram Profile URL</label><input type="url" id="instagram-url" placeholder="https://instagram.com/..." value="${this.settings.instagram}"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="app.saveSocialSettings()">Save Settings</button>
      </div>
    `;
  },

  async uploadLogo(){
    const file = document.getElementById('logo-file').files[0];
    if(!file){ alert('Choose a file'); return; }
    try{
      const storageRef = ref(storage, `logo/${Date.now()}`);
      await uploadBytes(storageRef, file);
      const url = `https://firebasestorage.googleapis.com/v0/b/kitsune-aniverse.firebasestorage.app/o/logo%2F${Date.now()}?alt=media`;
      await updateDoc(doc(db, 'settings', 'main'), { logoUrl: url });
      this.settings.logoUrl = url;
      document.getElementById('logo-display').innerHTML = `<img src="${url}"/>`;
      alert('Logo updated!');
    }catch(e){ alert('Error: ' + e.message); }
  },

  async saveSocialSettings(){
    try{
      await updateDoc(doc(db, 'settings', 'main'), {
        facebook: document.getElementById('facebook-url').value,
        youtube: document.getElementById('youtube-url').value,
        instagram: document.getElementById('instagram-url').value
      });
      this.settings.facebook = document.getElementById('facebook-url').value;
      this.settings.youtube = document.getElementById('youtube-url').value;
      this.settings.instagram = document.getElementById('instagram-url').value;
      this.updateSocialLinks();
      alert('Social media settings saved!');
    }catch(e){ alert('Error: ' + e.message); }
  },

  async saveSeries(){
    const title = document.getElementById('f-title').value.trim();
    if(!title){ alert('Enter title'); return; }
    const btn = document.getElementById('btn-series');
    btn.disabled = true;
    btn.textContent = 'Creating...';
    try{
      const cover = document.getElementById('f-cover').files[0];
      let coverUrl = null;
      if(cover){
        const storageRef = ref(storage, `covers/${Date.now()}`);
        await uploadBytes(storageRef, cover);
        coverUrl = `https://firebasestorage.googleapis.com/v0/b/kitsune-aniverse.firebasestorage.app/o/covers%2F${Date.now()}?alt=media`;
      }
      await addDoc(collection(db, 'series'), {
        title: document.getElementById('f-title').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        tags: document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        coverUrl, chapterCount: 0, createdAt: new Date().toISOString()
      });
      document.getElementById('f-title').value = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-tags').value = '';
      await this.loadSeries();
      alert('Series created!');
      this.render();
    }catch(e){ alert('Error: ' + e.message); }
    btn.disabled = false;
    btn.textContent = 'Create Series';
  },

  async saveChapter(){
    const seriesId = document.getElementById('f-series').value;
    if(!seriesId){ alert('Choose series'); return; }
    if(this.stagedFiles.length === 0){ alert('Upload files'); return; }
    
    const btn = document.getElementById('btn-chapter');
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    
    try{
      const num = parseFloat(document.getElementById('f-num').value) || 1;
      const title = document.getElementById('f-title2').value.trim() || `Chapter ${num}`;
      const type = document.getElementById('f-type').value;
      
      const chapRef = await addDoc(collection(db, 'chapters'), {
        seriesId, number: num, title, contentType: type, pageCount: this.stagedFiles.length, createdAt: new Date().toISOString()
      });

      let uploaded = 0;
      for(let i = 0; i < this.stagedFiles.length; i++){
        const file = this.stagedFiles[i];
        const storageRef = ref(storage, `content/${seriesId}/${chapRef.id}/${i}-${file.name}`);
        await uploadBytes(storageRef, file);
        const url = `https://firebasestorage.googleapis.com/v0/b/kitsune-aniverse.firebasestorage.app/o/content%2F${seriesId}%2F${chapRef.id}%2F${i}-${encodeURIComponent(file.name)}?alt=media`;
        
        await addDoc(collection(db, 'pages'), {
          chapterId: chapRef.id, order: i, url
        });
        
        uploaded++;
        const pct = Math.round((uploaded / this.stagedFiles.length) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent = `${pct}% uploaded`;
      }

      const series = this.series.find(s => s.id === seriesId);
      if(series) series.chapterCount++;
      
      this.stagedFiles = [];
      document.getElementById('f-series').value = '';
      document.getElementById('f-num').value = '1';
      document.getElementById('f-title2').value = '';
      document.getElementById('file-list').innerHTML = '';
      document.getElementById('progress').style.display = 'none';
      alert('Chapter uploaded!');
      this.render();
    }catch(e){ alert('Error: ' + e.message); }
    
    btn.disabled = false;
    btn.textContent = 'Upload Chapter';
  },

  async deleteSeries(id){
    if(!confirm('Delete this series and all chapters?')) return;
    try{
      await deleteDoc(doc(db, 'series', id));
      const snap = await getDocs(query(collection(db, 'chapters'), where('seriesId', '==', id)));
      for(const d of snap.docs) await deleteDoc(d.ref);
      this.series = this.series.filter(s => s.id !== id);
      alert('Series deleted');
      this.render();
    }catch(e){ alert('Error: ' + e.message); }
  },

  async deleteChapter(id){
    if(!confirm('Delete this chapter?')) return;
    try{
      await deleteDoc(doc(db, 'chapters', id));
      alert('Chapter deleted');
      this.renderSeriesDetail();
    }catch(e){ alert('Error: ' + e.message); }
  },

  editSeries(id){ alert('Edit feature coming soon'); },
  editChapter(id){ alert('Edit feature coming soon'); },

  wireUpload(){
    document.getElementById('f-files').addEventListener('change', (e) => {
      this.stagedFiles = Array.from(e.target.files);
      const list = document.getElementById('file-list');
      list.innerHTML = this.stagedFiles.map((f, i) => `<div style="font-size:12px;color:var(--text-dim);padding:6px 0;">✓ ${f.name} (${(f.size/1024/1024).toFixed(1)} MB)</div>`).join('');
      document.getElementById('progress').style.display = 'block';
    });

    document.getElementById('f-cover').addEventListener('change', () => {
      document.getElementById('cover-text').textContent = '✓ File selected';
    });

    document.getElementById('logo-file').addEventListener('change', () => {
      document.getElementById('logo-text').textContent = '✓ File selected';
    });
  },

  escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
};

app.boot();
</script>

</body>
</html>
